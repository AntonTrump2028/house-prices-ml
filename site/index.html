<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Калькулятор цены дома — ориентировочная оценка на основе ML.">
  <title>Калькулятор цены дома</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

  <div class="page">
    <header class="header">
      <h1 class="header__title">Калькулятор цены дома</h1>
      <p class="header__sub">оценка на основе ML</p>
      <a class="header__github" href="https://github.com/AntonTrump2028/house-prices-ml" target="_blank" rel="noopener noreferrer">GitHub</a>
    </header>

    <main id="main">
      <form class="card form" id="estimate-form" novalidate>
        <div class="field">
          <label for="country">Страна</label>
          <select id="country" name="country" required>
            <option value="Poland">Poland</option>
            <option value="Germany">Germany</option>
            <option value="USA">USA</option>
            <option value="Ukraine">Ukraine</option>
            <option value="Other">Other</option>
          </select>
          <p class="field__error" id="country-error" hidden></p>
        </div>

        <div class="field">
          <label for="city">Город</label>
          <input type="text" id="city" name="city" autocomplete="address-level2" required>
          <p class="field__error" id="city-error" hidden></p>
        </div>

        <div class="field">
          <label for="address">Адрес / улица</label>
          <input type="text" id="address" name="address" autocomplete="street-address" required>
          <p class="field__error" id="address-error" hidden></p>
        </div>

        <div class="field">
          <label for="buy_date">Дата покупки</label>
          <input type="date" id="buy_date" name="buy_date" required>
          <p class="field__error" id="buy_date-error" hidden></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="living_area">Площадь</label>
            <div class="input-suffix">
              <input type="number" id="living_area" name="living_area" min="1" step="any" required>
              <span class="suffix" aria-hidden="true">м²</span>
            </div>
            <p class="field__error" id="living_area-error" hidden></p>
          </div>

          <div class="field">
            <label for="bedrooms">Комнаты</label>
            <input type="number" id="bedrooms" name="bedrooms" min="1" step="1" required>
            <p class="field__error" id="bedrooms-error" hidden></p>
          </div>
        </div>

        <div class="field">
          <label for="year_built">Год постройки</label>
          <input type="number" id="year_built" name="year_built" min="1800" max="2100" step="1" placeholder="YYYY" required>
          <p class="field__error" id="year_built-error" hidden></p>
        </div>

        <div class="field field--checkbox">
          <label class="checkbox">
            <input type="checkbox" id="mortgage" name="mortgage">
            <span>Учитывать ипотеку</span>
          </label>
        </div>

        <div class="mortgage-fields" id="mortgage-fields" hidden>
          <div class="field-row">
            <div class="field">
              <label for="loan_years">Срок (лет)</label>
              <input type="number" id="loan_years" name="loan_years" min="1" max="50" step="1">
              <p class="field__error" id="loan_years-error" hidden></p>
            </div>

            <div class="field">
              <span class="label-text" id="rate-label">Ставка</span>
              <div class="segment" role="radiogroup" aria-labelledby="rate-label">
                <label class="segment__option">
                  <input type="radio" name="rate_mode" value="country" checked>
                  <span>Ставка страны</span>
                </label>
                <label class="segment__option">
                  <input type="radio" name="rate_mode" value="custom">
                  <span>Своя</span>
                </label>
              </div>

              <div class="input-suffix" id="country-rate-wrap">
                <input type="text" id="country_rate_display" readonly disabled aria-label="Ставка страны">
                <span class="suffix" aria-hidden="true">%</span>
              </div>

              <div class="input-suffix" id="custom-rate-wrap" hidden>
                <input type="number" id="interest_rate" name="interest_rate" min="0" max="100" step="0.01" aria-label="Своя ставка">
                <span class="suffix" aria-hidden="true">%</span>
              </div>
              <p class="field__error" id="interest_rate-error" hidden></p>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn--primary" id="submit-btn">Рассчитать</button>
      </form>

      <div class="alert" id="api-error" role="alert" hidden></div>

      <section class="card card--result" id="result" hidden aria-live="polite">
        <p class="result__label">Оценка цены</p>
        <p class="result__price" id="result-price"></p>
        <div class="result__mortgage" id="result-mortgage" hidden>
          <div class="result__row">
            <span>Первый взнос</span>
            <strong id="result-down"></strong>
          </div>
          <div class="result__row">
            <span>Ежемесячный платёж</span>
            <strong id="result-monthly"></strong>
          </div>
        </div>
        <p class="result__note">ориентировочно · модель RF</p>
      </section>
    </main>

    <footer class="footer">
      <p>Оценка ориентировочная и не является офертой.</p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
